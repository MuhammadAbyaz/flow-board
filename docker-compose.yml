services:
  postgres:
    image: postgres:15-alpine
    container_name: flow_board_postgres
    environment:
      POSTGRES_USER: flow_user
      POSTGRES_PASSWORD: flow_password
      POSTGRES_DB: flow_board
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
